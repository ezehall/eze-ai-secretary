name: EZE AI Secretary Daily

on:
  # 毎時ちょうど(:00)はGitHub Actions全体のスケジュール実行が集中し、
  # 高負荷時には通知なくスキップされることが公式に案内されている。
  # そのため実行時刻を:17にずらして混雑を避けている。
  # 22:17 UTC = 日本時間 07:17
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

# asset_history.json・portfolio.json・trade_history.jsonへの変更を
# コミット・pushするために書き込み権限が必要
permissions:
  contents: write

jobs:
  run-eze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run EZE
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python main.py

      # main.pyがLINE送信失敗などでエラー終了した場合でも、
      # 資産推移ログや売買履歴の反映結果は失わずコミットしておきたいため
      # if: always() で必ず実行する
      - name: Commit updated data files
        if: always()
        run: |
          git config user.name "eze-bot"
          git config user.email "eze-bot@users.noreply.github.com"

          for f in asset_history.json portfolio.json trade_history.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: update asset history and portfolio data"
            git push
          fi
